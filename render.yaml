# ─────────────────────────────────────────────────────────────────────────────
#  Render Blueprint — Zephiel (online, delivery-only jewellery store).
#  Deploy: Render Dashboard -> New -> Blueprint -> pick the akintanrapheal/zephiel repo.
#  Starts on the free tier to get live cheaply. IMPORTANT: before taking real orders,
#  upgrade the DATABASE off "free" (free Postgres has limited retention + no proper backups)
#  and consider a paid web plan to remove cold starts. Region = frankfurt (closest to Nigeria).
# ─────────────────────────────────────────────────────────────────────────────
databases:
  - name: zephiel-db
    plan: free
    databaseName: zephiel
    user: zephiel
    region: frankfurt

services:
  - type: web
    name: zephiel
    runtime: docker
    plan: free                 # free = spins down after ~15 min idle (cold start). Upgrade to
                               # 'starter' to remove cold starts when the store goes live.
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health   # dedicated liveness endpoint — keeps the instance healthy
    autoDeploy: true           # redeploy automatically on every push to the connected branch
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # West Africa Time (Nigeria, UTC+1). Also baked into the Dockerfile.
      - key: TZ
        value: Africa/Lagos
      # Single ephemeral instance: apply EF migrations on startup.
      - key: Database__AutoMigrate
        value: "true"
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:8080
      - key: PORT
        value: "8080"
      - key: AllowedHosts
        value: "*"
      # Database connection, injected by Render as a postgres:// URL.
      - key: DATABASE_URL
        fromDatabase:
          name: zephiel-db
          property: connectionString
      # Paystack (Zephiel's OWN account). sync:false → set the VALUES in the Render
      # Dashboard (Environment tab), never committed here. Needed for checkout payments.
      - key: Payment__Paystack__SecretKey
        sync: false
      - key: Payment__Paystack__PublicKey
        sync: false
      # Cloudinary (Zephiel's OWN account) — persistent product-image hosting. Without
      # these, uploads fall back to local disk which is wiped on every redeploy.
      - key: Cloudinary__CloudName
        sync: false
      - key: Cloudinary__ApiKey
        sync: false
      - key: Cloudinary__ApiSecret
        sync: false
      # Sentry error monitoring (optional). App stays inert until this DSN is set.
      - key: Sentry__Dsn
        sync: false
